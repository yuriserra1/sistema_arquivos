<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="920" height="380" rx="14" fill="#0f172a"/>
  <text x="40" y="48" fill="#f8fafc" font-size="22" font-weight="700">Como as senhas são guardadas</text>
  <text x="40" y="72" fill="#94a3b8" font-size="14">A senha nunca é gravada. Só o sal e o hash vão para o arquivo de senhas.</text>

  <!-- entradas -->
  <rect x="40" y="100" width="200" height="62" rx="10" fill="#312e81" stroke="#818cf8"/>
  <text x="60" y="126" fill="#eef2ff" font-size="15" font-weight="700">Senha digitada</text>
  <text x="60" y="148" fill="#c7d2fe" font-size="13" font-family="Consolas, Menlo, monospace">"ana123"</text>
  <rect x="40" y="182" width="200" height="62" rx="10" fill="#312e81" stroke="#818cf8"/>
  <text x="60" y="208" fill="#eef2ff" font-size="15" font-weight="700">Sal aleatório</text>
  <text x="60" y="230" fill="#c7d2fe" font-size="13">os.urandom(16) · 16 bytes</text>

  <line x1="240" y1="131" x2="300" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="240" y1="213" x2="300" y2="186" stroke="#64748b" stroke-width="2" marker-end="url(#seta)"/>

  <!-- pbkdf2 -->
  <rect x="304" y="132" width="250" height="80" rx="10" fill="#14532d" stroke="#22c55e"/>
  <text x="324" y="160" fill="#f0fdf4" font-size="15" font-weight="700">PBKDF2-HMAC-SHA256</text>
  <text x="324" y="182" fill="#bbf7d0" font-size="13">100.000 iterações</text>
  <text x="324" y="200" fill="#bbf7d0" font-size="13">hashlib.pbkdf2_hmac</text>

  <line x1="554" y1="172" x2="604" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#seta)"/>

  <!-- shadow -->
  <rect x="608" y="112" width="272" height="120" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="628" y="140" fill="#f8fafc" font-size="15" font-weight="700">/etc/shadow</text>
  <text x="628" y="160" fill="#94a3b8" font-size="13">dono root · permissão rw--</text>
  <text x="628" y="190" fill="#e2e8f0" font-size="13" font-family="Consolas, Menlo, monospace">ana:5428c07c…:915bb32b…</text>
  <text x="628" y="214" fill="#64748b" font-size="12" font-family="Consolas, Menlo, monospace">nome : sal  : hash</text>

  <!-- login -->
  <rect x="40" y="276" width="840" height="78" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="60" y="302" fill="#f8fafc" font-size="15" font-weight="700">No login</text>
  <text x="60" y="324" fill="#94a3b8" font-size="13">o hash da senha digitada é recalculado com o mesmo sal guardado e comparado com hmac.compare_digest,</text>
  <text x="60" y="343" fill="#94a3b8" font-size="13">que leva sempre o mesmo tempo · usuário inexistente e senha errada recebem a mesma mensagem</text>
</svg>
