<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 920 640" font-family="Consolas, Menlo, monospace" font-size="14">
  <rect width="920" height="640" rx="12" fill="#0d1117"/>
  <rect width="920" height="38" rx="12" fill="#161b22"/>
  <rect y="26" width="920" height="12" fill="#161b22"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/><circle cx="44" cy="19" r="6" fill="#ffbd2e"/><circle cx="64" cy="19" r="6" fill="#27c93f"/>
  <text x="460" y="24" fill="#8b949e" text-anchor="middle" font-size="13">python main.py — três usuários no mesmo disco</text>

  <g fill="#c9d1d9">
    <text x="24" y="70"><tspan fill="#d2a8ff">root@myfs&gt;</tspan> useradd ana</text>
    <text x="24" y="92"><tspan fill="#d2a8ff">root@myfs&gt;</tspan> useradd beto</text>
    <text x="24" y="114"><tspan fill="#d2a8ff">root@myfs&gt;</tspan> ls -l /home</text>
    <text x="24" y="136">drw--</text><text x="90" y="136">ana</text><text x="250" y="136" text-anchor="end">29</text><text x="270" y="136">ana</text>
    <text x="24" y="158">drw--</text><text x="90" y="158">beto</text><text x="250" y="158" text-anchor="end">29</text><text x="270" y="158">beto</text>
    <text x="24" y="180"><tspan fill="#d2a8ff">root@myfs&gt;</tspan> cat /etc/shadow</text>
    <text x="24" y="202" fill="#8b949e">ana:5428c07c95d3a12a66fe95d1b25bf01f:915bb32bd5b58dc88900236db0f3f71e73c1b9b5…</text>
    <text x="24" y="224" fill="#8b949e">beto:2c95544d79e115c7cdf77be7520b4cd8:fd525f403d9a274df115df3df0dc1230f6ecde59…</text>

    <text x="24" y="262"><tspan fill="#58a6ff">ana@myfs&gt;</tspan> cat /etc/shadow</text>
    <text x="24" y="284" fill="#f85149">Erro: Permissão negada (leitura): shadow</text>
    <text x="24" y="306"><tspan fill="#58a6ff">ana@myfs&gt;</tspan> rm /etc/shadow</text>
    <text x="24" y="328" fill="#f85149">Erro: Permissão negada (escrita): etc</text>
    <text x="24" y="350"><tspan fill="#58a6ff">ana@myfs&gt;</tspan> chmod rw-- segredo.txt</text>
    <text x="24" y="372"><tspan fill="#58a6ff">ana@myfs&gt;</tspan> chmod rwr- /home/ana</text>
    <text x="24" y="394"><tspan fill="#58a6ff">ana@myfs&gt;</tspan> ls -l</text>
    <text x="24" y="416">-rw--</text><text x="90" y="416">ana</text><text x="250" y="416" text-anchor="end">11</text><text x="270" y="416">segredo.txt</text>
    <text x="24" y="438">-rwr-</text><text x="90" y="438">ana</text><text x="250" y="438" text-anchor="end">15</text><text x="270" y="438">aviso.txt</text>

    <text x="24" y="476"><tspan fill="#3fb950">beto@myfs&gt;</tspan> cat /home/ana/aviso.txt</text>
    <text x="24" y="498">todos podem ler</text>
    <text x="24" y="520"><tspan fill="#3fb950">beto@myfs&gt;</tspan> cat /home/ana/segredo.txt</text>
    <text x="24" y="542" fill="#f85149">Erro: Permissão negada (leitura): segredo.txt</text>
    <text x="24" y="564"><tspan fill="#3fb950">beto@myfs&gt;</tspan> echo "oi" &gt;&gt; /home/ana/aviso.txt</text>
    <text x="24" y="586" fill="#f85149">Erro: Permissão negada (escrita): aviso.txt</text>
    <text x="24" y="616" fill="#8b949e"># root cria as contas · ana protege o que é dela · beto só lê o que ela liberou</text>
  </g>
</svg>
